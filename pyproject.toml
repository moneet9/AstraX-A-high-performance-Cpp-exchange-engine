[project]
name = "astrax-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
ml = ["xgboost>=2.0", "scikit-learn>=1.3"]
rl = ["stable-baselines3>=2.0", "gymnasium>=0.29"]
dev = ["pytest>=7.0"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
backend = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "PyJWT[crypto]>=2.9,<3",
  "passlib>=1.7.4,<2",
  "httpx>=0.27,<1",
  "aioapns>=3.2,<4",
]
