name: iOS

on:
  push:
    paths: ["ios/**", "backend/openapi.yaml", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "backend/openapi.yaml", ".github/workflows/ios.yml"]

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint Swift sources
        run: |
          cd ios
          swift-format format --in-place --recursive .
          swiftlint lint --strict
          swift-format lint --strict --recursive .
      - name: Test Core package
        run: swift test --package-path ios/Packages/Core
      - name: Test Trading package
        run: swift test --package-path ios/Packages/Trading
      - name: Resolve app packages
        run: xcodebuild -resolvePackageDependencies -project ios/AstraX.xcodeproj -scheme AstraX
      - name: Build iOS simulator app
        run: xcodebuild build -project ios/AstraX.xcodeproj -scheme AstraX -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
